---
- name: restart ntp
  ansible.builtin.service:
    name: ntp
    state: restarted

- name: restart cron
  ansible.builtin.service:
    name: cron
    state: restarted

- name: restart monit
  ansible.builtin.service:
    name: monit
    state: restarted

- name: restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: update aliases
  ansible.builtin.command: newaliases

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: swap used
  ansible.builtin.command: swapon -a

- name: update grub
  ansible.builtin.command: update-grub
