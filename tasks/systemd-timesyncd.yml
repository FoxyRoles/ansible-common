---

- name: systemd-timesyncd is not running
  ansible.builtin.service:
    name: systemd-timesyncd
    state: stopped
    enabled: no
  when: "'systemd-timesyncd.service' in (common_systemd_unit_files.stdout_lines | map('split') | map('first'))"
  tags: systemd-timesyncd

- name: systemd-timesyncd is absent
  apt:
    pkg: systemd-timesyncd
    state: absent
  tags: systemd-timesyncd
