---

- name: systemd-timesyncd is not running
  ansible.builtin.service:
    name: systemd-timesyncd
    state: stopped
    enabled: no
  when: ansible_facts['services']['systemd-timesyncd.service']['status'] | default('not-found') != 'not-found'
  tags: systemd-timesyncd

- name: systemd-timesyncd is absent
  apt:
    pkg: systemd-timesyncd
    state: absent
  tags: systemd-timesyncd
