- name: Check if /etc/systemd/system/sysinit.target.wants/systemd-timesyncd.service file exists
  stat:
    path: /etc/systemd/system/sysinit.target.wants/systemd-timesyncd.service
  register: timesyncdservice

- name: systemd-timesyncd is not running
  service:
    name: systemd-timesyncd
    state: stopped
    enabled: no
#  when: "'systemd-timesyncd.service' in services"
  when: timesyncdservice.stat.exists
  tags: systemd-timesyncd

- name: systemd-timesyncd is absent
  apt:
    pkg: systemd-timesyncd
    state: absent
  tags: systemd-timesyncd
