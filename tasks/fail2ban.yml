---

- name: Ensure fail2ban is present
  apt:
    name: fail2ban
    state: present

- name: Ensure log level is set to NOTICE
  community.general.ini_file:
    path: /etc/fail2ban/fail2ban.local
    section: Definition
    option: loglevel
    value: NOTICE
    owner: root
    group: root
    mode: "0644"
  notify:
   - restart fail2ban

- name: Ensure administrator addresses are excluded from Fail2ban
  community.general.ini_file:
    path: /etc/fail2ban/jail.local
    section: DEFAULT
    option: ignoreip
    value: "127.0.0.1/8 ::1 {{ admin_ips | map('ansible.utils.ipaddr', 'host') | join(' ') }}"
    owner: root
    group: root
    mode: "0644"
  notify:
   - restart fail2ban
