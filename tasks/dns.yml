---

- name: Check if /etc/systemd/system/multi-user.target.wants/systemd-resolved.service file exists
  stat:
    path: /etc/systemd/system/multi-user.target.wants/systemd-resolved.service
  register: resolvedservice

- name: ensure systemd-resolved is disabled
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: no
  when: resolvedservice.stat.exists

- name: check if /etc/resolv.conf is symlink
  stat:
    path: /etc/resolv.conf
  register: resolvconf

- name: ensure /etc/resolv.conf is not symlink
  file:
    path: /etc/resolv.conf
    state: absent
  when: resolvconf.stat.islnk is defined and resolvconf.stat.islnk

- name: ensure /etc/resolv.conf exists and have nameservers set
  copy:
    dest: /etc/resolv.conf
    content: |
      {% for server in dns_servers %}
      nameserver {{ server }}
      {% endfor %}
    force: no
