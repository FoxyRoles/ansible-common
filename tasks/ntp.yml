---

#- name: Populate service facts
#  service_facts:

- name: Check if /etc/systemd/system/ntp.service file exists
  stat:
    path: /etc/systemd/system/ntp.service
  register: ntpservice

- name: ntp is not running
  service:
    name: ntp
    state: stopped
    enabled: no
#  when: "'ntp.service' in ansible_facts.services"
  when: ntpservice.stat.exists
  tags: ntp

- name: ntp is absent
  apt:
    pkg: ntp
    state: absent
  tags: ntp
