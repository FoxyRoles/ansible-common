---

- name: Update Timezone to {{ timezone }}
  copy:
    dest: /etc/timezone
    content: "{{ timezone }}\n"
  register: timezone

- name: Reconfigure Timezone Data
  command: dpkg-reconfigure -f noninteractive tzdata
  when: timezone.changed

- name: locales are present
  locale_gen:
    name: "{{ item }}"
    state: present
  with_items:
   - en_US.UTF-8
   - cs_CZ.UTF-8
