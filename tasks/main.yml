---

- name: Gather service facts
  ansible.builtin.service_facts:

- import_tasks: locales.yml
- import_tasks: apt.yml
- import_tasks: packages.yml
- import_tasks: bash.yml
- import_tasks: dns.yml
- import_tasks: fail2ban.yml
- import_tasks: ipmitool.yml
  when: ansible_virtualization_role != "guest"
- import_tasks: smartmontools.yml
  when: ansible_virtualization_role != "guest"
- import_tasks: motd.yml
- import_tasks: ubuntu-pro.yml
- import_tasks: ntp.yml
- import_tasks: systemd-timesyncd.yml
- import_tasks: chrony.yml
- import_tasks: postfix.yml
- import_tasks: ssh.yml
- import_tasks: cloud-init.yml
- import_tasks: sysctl.yml
- import_tasks: systemd.yml
- import_tasks: zfs.yml
  when: ansible_facts['distribution_version'] is version('24.04', '>=')
