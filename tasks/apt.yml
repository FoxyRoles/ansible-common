- name: apt cache is updated
  apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Divert and rename apt-esm-hook
  community.general.dpkg_divert:
    path: /etc/apt/apt.conf.d/20apt-esm-hook.conf
    divert: /etc/apt/apt.conf.d/20apt-esm-hook.conf.disabled
    rename: true

- name: Divert and rename ubuntu-esm-apps.sources
  community.general.dpkg_divert:
    path: /var/lib/ubuntu-advantage/apt-esm/etc/apt/sources.list.d/ubuntu-esm-apps.sources
    divert: /var/lib/ubuntu-advantage/apt-esm/etc/apt/sources.list.d/ubuntu-esm-apps.sources.disabled
    rename: true

- name: unattended-upgrades package is present
  apt:
    pkg: unattended-upgrades
    state: present

- name: unattended-upgrades is configured
  template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades

- name: unattended-upgrades autoupgrade is allowed
  debconf:
    name: unattended-upgrades
    question: "unattended-upgrades/enable_auto_updates"
    value: "true"
    vtype: boolean
