---

- name: APT mirror is set
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: '^([ \t]*URIs:[ \t]+https?://)(?:[a-z0-9.-]+\.)?archive\.ubuntu\.com(?=/ubuntu(?:/|[ \t]|$))'
    replace: '\g<1>{{ apt_mirror }}'
  when: ansible_facts['distribution_version'] is version('24.04', '>=')
  register: apt_mirror_source

- name: apt cache is updated
  apt:
    update_cache: true
    cache_valid_time: "{{ 0 if apt_mirror_source is changed else apt_cache_valid_time }}"

- name: Divert and rename apt-esm-hook
  community.general.dpkg_divert:
    path: /etc/apt/apt.conf.d/20apt-esm-hook.conf
    divert: /etc/apt/apt.conf.d/20apt-esm-hook.conf.disabled
    rename: true

- name: Divert and rename ubuntu-esm-apps.sources
  community.general.dpkg_divert:
    path: /var/lib/ubuntu-advantage/apt-esm/etc/apt/sources.list.d/ubuntu-esm-apps.sources
    divert: /var/lib/ubuntu-advantage/apt-esm/etc/apt/sources.list.d/ubuntu-esm-apps.sources.disabled
    rename: true

- name: unattended-upgrades package is present
  apt:
    pkg: unattended-upgrades
    state: present

- name: unattended-upgrades is configured
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: unattended-upgrades autoupgrade is allowed
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
