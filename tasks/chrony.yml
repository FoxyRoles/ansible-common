---

- name: Disable default Ubuntu time sources
  ansible.builtin.debconf:
    name: chrony
    question: chrony/configure_ubuntu_pools_in_sourcesd
    value: "false"
    vtype: boolean
  when: ansible_facts['distribution_version'] is version('24.10', '>=')
  tags: chrony

- name: chrony is present
  apt:
    pkg: chrony
    state: present
  tags: chrony

- name: chrony is enabled
  service:
    name: chrony
    state: started
    enabled: yes
  tags: chrony

- name: chrony default servers are absent
  lineinfile:
    dest: /etc/chrony/chrony.conf
    regexp: '^pool '
    state: absent
  notify:
    - restart chrony
  tags: chrony

- name: ubuntu default servers are absent
  file:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    state: absent
  notify:
    - restart chrony
  tags: chrony

- name: copy /etc/chrony/sources.d/czech.sources
  copy:
    src: chrony.sources
    dest: /etc/chrony/sources.d/czech.sources
    mode: 0644
  notify:
    - restart chrony
  tags: chrony
