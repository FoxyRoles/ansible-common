---

- name: "sysctl: set vm.swappiness to 0"
  sysctl:
    name: vm.swappiness
    value: "0"
    state: present

- name: "sysctl: set fs.file-max to 200000"
  sysctl:
    name: fs.file-max
    value: "200000"
    state: present

- name: "sysctl: set net.core.somaxconn to 4096"
  sysctl:
    name: net.core.somaxconn
    value: "4096"
    state: present

- name: "sysctl: net.core.netdev_max_backlog to 4096"
  sysctl:
    name: net.core.netdev_max_backlog
    value: "4096"
    state: present

- name: "sysctl: net.ipv4.tcp_max_syn_backlog to 4096"
  sysctl:
    name: net.ipv4.tcp_max_syn_backlog
    value: "4096"
    state: present

- name: "sysctl: set net.ipv4.ip_local_port_range to 5000 65535"
  sysctl:
    name: net.ipv4.ip_local_port_range
    value: "5000 65535"
    state: present

- name: "sysctl: net.ipv4.tcp_fin_timeout to 30"
  sysctl:
    name: net.ipv4.tcp_fin_timeout
    value: "30"
    state: present
