---

- name: Check if /etc/default/motd-news file exists
  stat:
    path: /etc/default/motd-news
  register: motdnews

- name: MOTD news are disabled
  lineinfile:
    dest: /etc/default/motd-news
    regexp: ^ENABLED=
    line: ENABLED=0
  when: motdnews.stat.exists

- name: Check if /etc/update-motd.d/10-help-text file exists
  stat:
    path: /etc/update-motd.d/10-help-text
  register: helptext

- name: MOTD help text is disabled
  file:
    path: /etc/update-motd.d/10-help-text
    mode: "0644"
  when: helptext.stat.exists

- name: MOTD available updates and Ubuntu Pro messages are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/update-motd.d/88-esm-announce
    - /etc/update-motd.d/90-updates-available
    - /etc/update-motd.d/91-contract-ua-esm-status
